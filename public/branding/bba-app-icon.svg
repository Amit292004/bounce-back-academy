<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141624" />
      <stop offset="100%" stop-color="#08090E" />
    </linearGradient>

    <!-- Kinetic Gradient -->
    <linearGradient id="appKineticGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="28%" stop-color="#FF5E62" />
      <stop offset="58%" stop-color="#8B5CF6" />
      <stop offset="85%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Secondary Gradient -->
    <linearGradient id="appSecondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="appArrowGleam" x1="0%" y1="80%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="90%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- App Border Ring -->
    <linearGradient id="appBorderRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#FF3366" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Glow -->
    <filter id="appGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="appDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- iOS / Android Squircle Base (512x512, rx 112) -->
  <rect width="512" height="512" rx="112" fill="url(#appBgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#appBorderRing)" stroke-width="3" />

  <!-- Radial Backdrop Glow -->
  <circle cx="256" cy="230" r="180" fill="#8B5CF6" fill-opacity="0.18" filter="url(#appGlow)" />
  <circle cx="340" cy="180" r="120" fill="#06B6D4" fill-opacity="0.12" filter="url(#appGlow)" />

  <!-- Main Icon Elements -->
  <g filter="url(#appDropShadow)">
    <!-- Ground Spring Baseline -->
    <path d="M 125 405 C 180 405, 215 425, 260 425 C 310 425, 345 405, 395 405" 
          stroke="url(#appKineticGrad)" stroke-width="4" stroke-linecap="round" opacity="0.4" />

    <!-- Vertical Stem with Rebound Spring Loop at the Bottom -->
    <path d="M 172 135 L 172 360 C 172 405, 210 430, 255 430 C 298 430, 328 402, 344 372" 
          fill="none" stroke="url(#appKineticGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Upper Wing / Loop of the 'B' -->
    <path d="M 172 135 L 290 135 C 342 135, 376 168, 376 214 C 376 258, 342 288, 292 288 L 198 288" 
          fill="none" stroke="url(#appKineticGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Lower Dynamic Loop of the 'B' -->
    <path d="M 238 288 L 306 288 C 358 288, 392 322, 392 366 C 392 404, 364 430, 320 430 C 285 430, 260 412, 248 392" 
          fill="none" stroke="url(#appSecondaryGrad)" stroke-width="30" stroke-linecap="round" />

    <!-- Ascending Momentum Arrow -->
    <path d="M 215 395 L 405 145" 
          fill="none" stroke="url(#appArrowGleam)" stroke-width="34" stroke-linecap="round" />
    <polygon points="415,108 438,184 374,162" 
             fill="#38BDF8" stroke="#E0F2FE" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Star & Rebound Spark Nodes -->
    <circle cx="438" cy="118" r="6" fill="#FFFFFF" />
    <circle cx="215" cy="395" r="5" fill="#FF5E62" />
  </g>
</svg>
