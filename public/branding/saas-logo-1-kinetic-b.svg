<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kb-grad-main" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="kb-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="kb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Canvas background (transparent-friendly, subtle dark container) -->
  <rect width="512" height="512" rx="112" fill="#0A0B10"/>
  
  <g transform="translate(48, 48) scale(0.8125)">
    <!-- Ambient back-glow -->
    <path d="M 140 100 L 290 100 C 350 100, 390 140, 390 190 C 390 230, 360 260, 310 270 C 375 280, 410 325, 410 380 C 410 440, 355 480, 280 480 L 140 480 Z" 
          fill="none" stroke="url(#kb-grad-main)" stroke-width="40" opacity="0.15" filter="url(#kb-glow)"/>

    <!-- The Modern SaaS 'B' Mark with Kinetic Momentum -->
    <!-- Vertical Spine with bottom rebound sweep -->
    <path d="M 140 100 L 140 400 C 140 450, 180 480, 230 480 C 270 480, 300 455, 315 425 L 435 155" 
          fill="none" stroke="url(#kb-grad-main)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Arrowhead of the rising momentum vector -->
    <path d="M 365 130 L 445 135 L 450 215" 
          fill="none" stroke="#06B6D4" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Top Loop of 'B' -->
    <path d="M 140 100 L 285 100 C 340 100, 375 135, 375 185 C 375 235, 340 270, 285 270 L 170 270" 
          fill="none" stroke="url(#kb-grad-main)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lower Loop of 'B' merging into the rebound -->
    <path d="M 230 270 L 295 270 C 350 270, 385 305, 385 355 C 385 395, 360 425, 315 425" 
          fill="none" stroke="url(#kb-grad-accent)" stroke-width="36" stroke-linecap="round"/>
  </g>
</svg>