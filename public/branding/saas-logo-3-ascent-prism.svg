<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ap-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="ap-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="ap-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#090A0F"/>

  <g transform="translate(100, 96)">
    <!-- Stage 1: The Foundation / Rebound Strike (Bottom Prism) -->
    <path d="M 0 320 L 130 320 C 180 320, 220 285, 220 240 C 220 205, 190 175, 150 170 L 0 170 Z" 
          fill="url(#ap-grad1)"/>

    <!-- Stage 2: The Ascending Velocity (Top Prism) -->
    <path d="M 0 150 L 110 150 C 150 150, 185 120, 185 80 C 185 40, 150 10, 110 10 L 0 10 Z" 
          fill="url(#ap-grad2)"/>

    <!-- Stage 3: The Soaring Vector Arrow (Cutting across and soaring to top right) -->
    <path d="M 40 310 L 270 20 L 320 70 L 90 360 Z" 
          fill="url(#ap-grad3)" opacity="0.95"/>
    <polygon points="260,0 335,15 320,90" fill="#06B6D4"/>
  </g>
</svg>