<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Rounded Container -->
  <rect width="128" height="128" rx="28" fill="#090A10" />

  <!-- Bold High-Contrast Favicon Icon Glyph -->
  <g transform="translate(18, 16) scale(0.24)">
    <!-- Stem and bottom rebound -->
    <path d="M 100 80 L 100 320 C 100 365, 140 390, 185 390 C 225 390, 255 365, 270 335 L 350 155" 
          fill="none" stroke="url(#favGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Top Loop of 'B' -->
    <path d="M 100 80 L 210 80 C 265 80, 295 110, 295 155 C 295 200, 265 230, 210 230 L 125 230" 
          fill="none" stroke="url(#favGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arrowhead of Momentum -->
    <polygon points="360,95 385,170 320,150" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4" />
  </g>
</svg>
